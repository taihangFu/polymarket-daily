<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polymarket 每日掃描</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    header {
      background: rgba(255,255,255,0.72);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    .logo { font-weight: 600; font-size: 1.25rem; letter-spacing: -0.01em; }
    main { padding: 48px 0 0; }
    .section-title { font-size: 1.5rem; margin-bottom: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .meta { color: var(--muted); font-size: 0.875rem; margin-bottom: 24px; }
    .empty { color: var(--muted); font-size: 1rem; padding: 32px 0; }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .tag {
      display: inline-block;
      background: rgba(0,0,0,0.04);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-bottom: 8px;
      margin-right: 8px;
    }
    .card h3 { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
    .card .price { font-size: 1.25rem; font-weight: 600; color: var(--text); margin-bottom: 12px; }
    .card p { font-size: 0.95rem; color: var(--muted); margin-bottom: 8px; }
    .card a { color: var(--accent); text-decoration: none; font-size: 0.875rem; }
    .card a:hover { opacity: 0.85; }
    footer {
      max-width: 720px;
      margin: 64px auto 56px;
      padding: 0 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap"><div class="logo">Polymarket 每日掃描</div></div>
  </header>
  <main class="wrap">
    <h2 class="section-title">今日機會</h2>
    <div class="meta" id="date-meta">載入中…</div>
    <div id="hot"></div>
    <h2 class="section-title" style="margin-top:40px">冷門機會</h2>
    <div id="cold"></div>
  </main>
  <footer>只推有 edge 的盤——高流動熱門＋冷門機會。內容由 Polymarket Scanner 定稿。</footer>
  <script>
    function pct(p) {
      if (typeof p !== 'number') return '';
      return Math.round(p * 100) + '¢';
    }
    function fmtResolves(v) {
      if (!v) return '';
      const s = String(v);
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }
      return s.length > 10 ? s.slice(0, 10) : s;
    }
    function settlement(m) {
      const parts = [];
      if (m.resolvesAt) parts.push('截止 ' + fmtResolves(m.resolvesAt));
      if (m.resolutionMethod) parts.push('方式 ' + m.resolutionMethod);
      if (m.resolvedBy) parts.push('裁定 ' + m.resolvedBy);
      if (!parts.length) return '';
      return '<p><strong>結算</strong>：' + parts.join(' · ') + '</p>';
    }
    function card(m) {
      const el = document.createElement('div');
      el.className = 'card';
      const side = m.side ? String(m.side) : '';
      const note = m.note ? `<p>${m.note}</p>` : '';
      const settle = settlement(m);
      const link = m.url
        ? `<a href="${m.url}" target="_blank" rel="noopener noreferrer">打開市場 →</a>`
        : '';
      el.innerHTML = `
        <span class="tag">${m.kind === 'cold' ? '冷門' : '熱門'}</span>
        <span class="tag">${side}</span>
        <h3>${m.title || ''}</h3>
        <div class="price">${pct(m.price)} · ${side}</div>
        <p><strong>Edge</strong>：${m.edge || ''}</p>
        <p><strong>陷阱</strong>：${m.trap || ''}</p>
        ${settle}
        ${note}
        <div style="margin-top:12px;text-align:right">${link}</div>
      `;
      return el;
    }
    async function load() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        const data = await res.json();
        document.getElementById('date-meta').textContent = data.date
          ? ('資料日期 · ' + data.date)
          : '';
        const markets = Array.isArray(data.markets) ? data.markets : [];
        const hot = document.getElementById('hot');
        const cold = document.getElementById('cold');
        hot.innerHTML = '';
        cold.innerHTML = '';
        const h = markets.filter(m => m && m.kind === 'hot');
        const c = markets.filter(m => m && m.kind === 'cold');
        if (!h.length) hot.innerHTML = '<div class="empty">今日無熱門機會</div>';
        else h.forEach(m => hot.appendChild(card(m)));
        if (!c.length) cold.innerHTML = '<div class="empty">今日無冷門機會</div>';
        else c.forEach(m => cold.appendChild(card(m)));
      } catch (e) {
        document.getElementById('date-meta').textContent = '載入失敗';
        console.error(e);
      }
    }
    load();
  </script>
</body>
</html>
